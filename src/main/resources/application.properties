# ============ SERVER CONFIG ============
server.port=8080
server.servlet.context-path=/api

# ============ APPLICATION ============
spring.application.name=portfolio-backend

# ============ ACTUATOR ============
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ============ INFO ENDPOINT ============
info.app.name=Portfolio Backend API
info.app.description=Backend para portfólio usando Spring Boot 4.0.2
info.app.version=1.0.0
info.app.author=Wara Pardo
info.app.java.version=25
info.app.spring.boot.version=4.0.2

# ============ DEVELOPMENT ============
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true
logging.level.com.portfolio.wara=DEBUG